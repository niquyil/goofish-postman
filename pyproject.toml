[project]
name = "GoofishPostman"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pyexecjs>=1.5.1",
    "python-dotenv>=1.2.2",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "typing-extensions>=4.15.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true
